name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish extensions
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build extension packages
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          cargo install --git https://github.com/0xsouravm/oxichrome \
            --rev f36ed22c007541e47308904ee925e21aa544e431 cargo-oxichrome
          cargo oxichrome build --release
          cargo oxichrome build --release --target firefox
          (cd dist/chromium && zip -qr ../betteread-chromium.zip .)
          (cd dist/firefox && zip -qr ../betteread-firefox.zip .)

      - name: Build bilingual release notes
        run: bash .github/scripts/build-release-notes.sh > RELEASE_NOTES.md

      - name: Create GitHub Release
        run: |
          gh release create "$TAG" dist/betteread-*.zip \
            --title "BettRead $TAG" --notes-file RELEASE_NOTES.md
